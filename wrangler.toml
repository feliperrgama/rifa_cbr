name = "rifa-cbr"
main = "src/worker.js"
compatibility_date = "2026-09-29"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "rifa-db"
# Substitua pelo database_id retornado por `npx wrangler d1 create rifa-db`.
database_id = "PREENCHER_APOS_CRIAR_O_D1"
